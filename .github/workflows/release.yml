name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

# Fork note: upstream's release pipeline needs the upstream-only Tauri updater
# signing key plus an Apple Developer ID for signing/notarization, none of
# which exist for this fork. This workflow ships an unsigned (ad-hoc) Apple
# Silicon build instead: macOS-only, no updater artifacts (OTA updates are
# disabled in this fork by design; see commit 82cf3023).
jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App (macOS arm64, ad-hoc signed)
        shell: bash
        timeout-minutes: 60
        run: pnpm tauri build --bundles app

      - name: Prepare release assets
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME}"
          APP_PATH=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found" >&2
            exit 1
          fi

          # zip: unpack-and-run
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release-assets/CC-Switch-${VERSION}-macOS-arm64.zip"

          # DMG via create-dmg (no codesign, no notarization)
          HOMEBREW_NO_AUTO_UPDATE=1 brew install create-dmg
          DMG_STAGE_DIR="$RUNNER_TEMP/dmg-stage"
          rm -rf "$DMG_STAGE_DIR"
          mkdir -p "$DMG_STAGE_DIR"
          ditto "$APP_PATH" "$DMG_STAGE_DIR/CC Switch.app"
          create-dmg \
            --volname "CC Switch himiyosh" \
            --window-size 660 400 \
            --window-pos 200 120 \
            --icon-size 80 \
            --icon "CC Switch.app" 180 220 \
            --hide-extension "CC Switch.app" \
            --app-drop-link 480 220 \
            --no-internet-enable \
            "release-assets/CC-Switch-${VERSION}-macOS-arm64.dmg" \
            "$DMG_STAGE_DIR"
          rm -rf "$DMG_STAGE_DIR"
          ls -la release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: CC Switch ${{ github.ref_name }} (himiyosh custom)
          body: |
            ## CC Switch ${{ github.ref_name }} — himiyosh カスタム版

            ⚠️ これは [farion1231/cc-switch](https://github.com/farion1231/cc-switch) の**非公式な個人フォーク**のビルドです。公式版は upstream の [Releases](https://github.com/farion1231/cc-switch/releases) から入手してください。

            ### 本家との違い
            - プロバイダー切り替え時に手書きの config.toml セクションを保護（保護マージ）
            - Codex のメモリ抽出/統合モデルをアクティブモデルへピン（GPT への裏課金防止）
            - 公式 ⇄ カスタム切り替え時の確認ダイアログ
            - live 設定インポート時の誤分類修正（ChatGPT OAuth 誤紐付けの根治）
            - OTA 自動更新は無効（更新は upstream merge + 再ビルドで実施）

            詳細: [docs/FORK_SETUP.ja.md](https://github.com/himiyosh/cc-switch/blob/himiyosh/local-customizations/docs/FORK_SETUP.ja.md)

            ### インストール（Apple Silicon 専用）
            Apple 公証を行っていないため、初回はターミナルで隔離属性を外してから起動してください:

            ```sh
            xattr -dr com.apple.quarantine "/Applications/CC Switch.app"
            ```

            または `.app` を右クリック → 「開く」でも起動できます。
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
