name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

# Fork note: upstream's release pipeline needs the upstream-only Tauri updater
# signing key plus an Apple Developer ID for signing/notarization, none of
# which exist for this fork. This workflow ships an unsigned (ad-hoc) Apple
# Silicon build instead: macOS-only, no updater artifacts (OTA updates are
# disabled in this fork by design; see commit 82cf3023).
jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App (macOS arm64, ad-hoc signed)
        shell: bash
        timeout-minutes: 60
        run: pnpm tauri build --bundles app

      - name: Prepare release assets
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME}"
          APP_PATH=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found" >&2
            exit 1
          fi

          # zip: unpack-and-run
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release-assets/CC-Switch-${VERSION}-macOS-arm64.zip"

          # DMG via create-dmg (no codesign, no notarization)
          HOMEBREW_NO_AUTO_UPDATE=1 brew install create-dmg
          DMG_STAGE_DIR="$RUNNER_TEMP/dmg-stage"
          rm -rf "$DMG_STAGE_DIR"
          mkdir -p "$DMG_STAGE_DIR"
          ditto "$APP_PATH" "$DMG_STAGE_DIR/CC Switch.app"
          create-dmg \
            --volname "CC Switch" \
            --window-size 660 400 \
            --window-pos 200 120 \
            --icon-size 80 \
            --icon "CC Switch.app" 180 220 \
            --hide-extension "CC Switch.app" \
            --app-drop-link 480 220 \
            --no-internet-enable \
            "release-assets/CC-Switch-${VERSION}-macOS-arm64.dmg" \
            "$DMG_STAGE_DIR"
          rm -rf "$DMG_STAGE_DIR"
          ls -la release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: CC Switch ${{ github.ref_name }} — Custom Build
          body: |
            ## 🔀 CC Switch — カスタムビルド

            Codex（ChatGPT Desktop App）で **OpenRouter などの外部プロバイダーを安心して使う** ための非公式ビルドです。

            > 📦 公式版は [upstream の Releases](https://github.com/farion1231/cc-switch/releases) へ

            ---

            ## 📥 インストール（Apple Silicon）

            **1.** 下の `.dmg` をダウンロード → アプリを **Applications** へドラッグ

            **2.** 初回のみ、ターミナルで 1 行実行：

            ```sh
            xattr -dr com.apple.quarantine "/Applications/CC Switch.app"
            ```

            > 💡 Apple 公証をしていないための手順です。`.app` を右クリック →「開く」でも代用できます。

            ---

            ## ✨ 本家との違い

            | | 本家 | このビルド |
            |:--|:--|:--|
            | 🛡️ **設定ファイル** | 切り替えのたびに丸ごと上書き。手書きの設定が消えることがある | 管理項目だけを更新し、他はそのまま残す |
            | 💰 **裏側の課金** | 外部プロバイダー利用中も GPT を呼び、気づかないまま課金される | いま選んでいるモデルに自動で揃える |
            | 🔔 **切り替え時** | 無言で切り替わり、機能が突然消えたように見える | 得るもの・失うものを事前に表示 |
            | 🔓 **公式への復帰** | 設定の誤判定で、戻れなくなることがある | 誤判定を根本から修正 |
            | 🔄 **自動更新** | 有効 | 無効（更新すると上記がすべて消えるため） |

            <details>
            <summary><b>📖 もう少し詳しく</b></summary>

            <br>

            **🛡️ 手作業の設定が消えない**

            本家は切り替えのたびに Codex の設定ファイルを保存済みスナップショットで置き換えるため、手で書き足した設定（プロジェクトの信頼設定・プラグイン・自作のプロバイダー定義など）が失われることがあります。このビルドは cc-switch が管理する項目だけを書き換えます。

            <sub>本家の既知問題 #4254 / #3700 ほか</sub>

            **💰 身に覚えのない OpenAI 課金を防ぐ**

            Codex は会話メモリの整理などの裏側の処理に GPT を固定で使います。外部プロバイダー利用中はその呼び出しもそちらへ流れ、画面に出ないまま課金されます（新規チャット 1 件あたり最大 3 回・各 1.5 万トークン規模）。

            **🔔 切り替える前に、何が起きるか分かる**

            公式 ⇔ 外部プロバイダーの切り替えでは、Sites・音声入力・クラウドプロジェクトなどが使えなくなったり戻ったりします。確認ダイアログで事前に提示します（「今後表示しない」も選べます）。

            **🔓「公式に戻れない」バグの修正**

            API キーを環境変数やキーチェーンから渡す設定を、本家は公式プロバイダーと誤判定して ChatGPT アカウントに紐付けます。以後、公式へ戻す操作が安全装置で毎回中断され、UI からは解除できません。これを根本から修正しました。

            </details>

            <details>
            <summary><b>🌐 English</b></summary>

            <br>

            An unofficial build that makes Codex (the ChatGPT Desktop App) safe to use with third-party providers such as OpenRouter. For the official app, see the [upstream releases](https://github.com/farion1231/cc-switch/releases).

            | | Upstream | This build |
            |:--|:--|:--|
            | 🛡️ **Config file** | Replaced wholesale on every switch; hand-written settings can vanish | Only cc-switch-managed keys are rewritten |
            | 💰 **Hidden billing** | Background jobs keep calling GPT while you're on another provider | Pinned to the model you actually selected |
            | 🔔 **Switching** | Happens silently; features seem to disappear | A dialog spells out what you gain and lose |
            | 🔓 **Going back** | A misclassification can leave you unable to return | Fixed at the root |
            | 🔄 **Auto-update** | Enabled | Disabled — an update would remove all of the above |

            **Install (Apple Silicon):** download the `.dmg`, drag the app to **Applications**, then run once:

            ```sh
            xattr -dr com.apple.quarantine "/Applications/CC Switch.app"
            ```

            The DMG is not notarized, hence the quarantine step. Right-click → "Open" works too.

            </details>

            ---

            <sub>🔧 技術的な詳細とセットアップ手順 / technical details and setup → <a href="https://github.com/himiyosh/cc-switch/blob/himiyosh/local-customizations/docs/FORK_SETUP.ja.md">docs/FORK_SETUP.ja.md</a></sub>
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
